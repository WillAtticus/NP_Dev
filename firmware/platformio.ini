; PlatformIO Project Configuration File for NeuroPulse ESP32 Firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D NEUROPULSE_FIRMWARE_VERSION=\"0.1.0\"
    -I common/protocol
    -I common/device_info
    -I common/diagnostics
    -I src/drivers

lib_deps =
    adafruit/Adafruit ADXL345@^1.3.4
    adafruit/Adafruit Unified Sensor@^1.1.14
